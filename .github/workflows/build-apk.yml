name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Read and verify app version
        id: version
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1 | tr -d "\"'")"
          version_name="${app_version%%+*}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version_name" ]]; then
            echo "Tag $GITHUB_REF_NAME must match the app version v$version_name in pubspec.yaml."
            exit 1
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          flutter build apk --release

      - name: Name APK with app version
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/puli-meka-${{ steps.version.outputs.app_version }}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: puli-meka-${{ steps.version.outputs.app_version }}
          path: dist/*.apk
          if-no-files-found: error
